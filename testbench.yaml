laravel: '@testbench'

env:
  - APP_ENV=local
  - APP_DEBUG=true
  # sandbox only: base64 of 'usephp-laravel-sandbox-dummy-key', not a secret
  - APP_KEY=base64:dXNlcGhwLWxhcmF2ZWwtc2FuZGJveC1kdW1teS1rZXk=

providers:
  - Kojirock5260\UsePhpLaravel\UsePhpServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    factories: true
    views: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets: []
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
